name: Build and push Docker images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  IMAGE_PREFIX: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iosdeob

jobs:
  # Each arch is built natively on its own runner (GitHub's arm64 runners are
  # free for public repos) and pushed by digest only; `merge` then stitches
  # the per-arch digests into one multi-arch tag, so `docker pull` picks the
  # right image on both amd64 and arm64 hosts. Emulating arm64 under QEMU on
  # an amd64 runner also works, but makes the worker's r2ghidra C++ build
  # crawl.
  build:
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, worker, worker-android]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} (${{ matrix.arch }}) by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      # Arch goes before service in the name so `digests-*-worker` in `merge`
      # can't also match worker-android's digests.
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}-${{ matrix.service }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [web, api, worker, worker-android]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.service }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image name and version
        id: meta
        run: |
          echo "image=${IMAGE_PREFIX}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push multi-arch ${{ matrix.service }} manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="${{ steps.meta.outputs.image }}"
          refs=()
          for digest in *; do refs+=("${image}@sha256:${digest}"); done
          docker buildx imagetools create \
            -t "${image}:${{ steps.meta.outputs.version }}" \
            -t "${image}:latest" \
            "${refs[@]}"

      - name: Inspect ${{ matrix.service }} manifest
        run: docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
