networks:
  frontend-net:
  backend-net:
    internal: true
  # Non-internal (egress-capable) network used ONLY by the reflutter service,
  # which must reach GitHub to download the matching pre-patched Flutter
  # engine. The analysis workers deliberately stay off this network.
  egress-net:

volumes:
  uploads:
  extract-scratch:
  sqlite-data:
  binaries:
  reflutter-artifacts:

services:
  proxy:
    image: caddy:2-alpine
    depends_on:
      - web
      - api
    ports:
      - "8080:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - frontend-net

  web:
    image: algorithmss/iosdeob-web:latest
    networks:
      - frontend-net
    environment:
      - VITE_API_BASE=/api
    volumes:
      - ./web:/app
      - /app/node_modules

  api:
    image: algorithmss/iosdeob-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - redis
    environment:
      - DATABASE_PATH=/data/app.db
      - UPLOADS_DIR=/uploads
      - REFLUTTER_ARTIFACTS_DIR=/reflutter-artifacts
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-dev-internal-token-change-me}
    volumes:
      - sqlite-data:/data
      - uploads:/uploads
      # read-write so the API can stream patched artifacts AND remove a job's
      # artifact directory when it's deleted
      - reflutter-artifacts:/reflutter-artifacts

  worker:
    image: algorithmss/iosdeob-worker:latest
    networks:
      - backend-net
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /work:size=2g
      - /tmp:size=512m
    environment:
      - UPLOADS_DIR=/uploads
      - EXTRACT_DIR=/work
      - BINARIES_DIR=/binaries
      - REDIS_URL=redis://redis:6379/0
      - API_INTERNAL_URL=http://api:8000
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-dev-internal-token-change-me}
    volumes:
      - uploads:/uploads:ro
      - binaries:/binaries
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

  worker-android:
    image: algorithmss/iosdeob-worker-android:latest
    networks:
      - backend-net
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /work:size=2g
      - /tmp:size=512m
      - /root:size=128m
    environment:
      - UPLOADS_DIR=/uploads
      - EXTRACT_DIR=/work
      - REDIS_URL=redis://redis:6379/0
      - API_INTERNAL_URL=http://api:8000
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-dev-internal-token-change-me}
    volumes:
      - uploads:/uploads:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

  # Patches Flutter apps with reFlutter. Unlike worker/worker-android this one
  # has internet egress (via egress-net) because reFlutter downloads the
  # matching pre-patched Flutter engine from GitHub at patch time. It only
  # patches/repackages the uploaded app — it never executes it.
  reflutter:
    image: algorithmss/iosdeob-reflutter:latest
    networks:
      - backend-net
      - egress-net
    depends_on:
      - redis
    tmpfs:
      - /work:size=4g
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_INTERNAL_URL=http://api:8000
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-dev-internal-token-change-me}
      - UPLOADS_DIR=/uploads
      - REFLUTTER_ARTIFACTS_DIR=/reflutter-artifacts
      - WORK_DIR=/work
    volumes:
      - uploads:/uploads:ro
      - reflutter-artifacts:/reflutter-artifacts
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - frontend-net
      - backend-net
